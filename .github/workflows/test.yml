name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COVERPKG: github.com/xhd2015/llm-proxy/...
      COVERMODE: set
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go test
        run: |
          go test -count=1 \
            -covermode="$COVERMODE" \
            -coverpkg="$COVERPKG" \
            -coverprofile=coverage-gotest.out \
            ./...

      - name: Install doctest
        run: go install github.com/xhd2015/doctest/cmd/doctest@latest

      - name: Doctest vet
        run: doctest vet ./...

      - name: Doctest
        run: |
          doctest test -count=1 \
            -cover \
            -covermode="$COVERMODE" \
            -coverpkg="$COVERPKG" \
            -coverprofile=coverage-doctest.out \
            ./...

      - name: Install xgo
        run: |
          curl -fsSL https://github.com/xhd2015/xgo/raw/master/script/install/install.sh \
            | env INSTALL_TO_BIN=true bash
          xgo version

      - name: Merge coverage and report
        run: |
          set -euo pipefail
          profiles=()
          for profile in coverage-gotest.out coverage-doctest.out; do
            if [[ -s "$profile" ]]; then
              profiles+=("$profile")
              echo "include $profile ($(wc -c <"$profile") bytes)"
            else
              echo "skip missing/empty $profile"
            fi
          done
          if [[ ${#profiles[@]} -eq 0 ]]; then
            echo "No coverage profiles found" >&2
            exit 1
          fi
          xgo tool coverage merge -o coverage.out "${profiles[@]}"
          go tool cover -func=coverage.out | tee coverage-func.txt
          {
            echo "## Coverage"
            echo
            echo "Sources: ${profiles[*]}"
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          if-no-files-found: ignore
          path: |
            coverage.out
            coverage-func.txt
            coverage-gotest.out
            coverage-doctest.out
